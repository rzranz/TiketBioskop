spring.application.name=cinema-backend

# Database Configuration (H2 In-Memory untuk tahap belajar & dev lokal)
spring.datasource.url=jdbc:h2:mem:cinemadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate: Otomatis generate tabel database dari Java Entity
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console: Antarmuka Web untuk melihat isi tabel di browser (/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
